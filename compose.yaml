services:
  web:
    build: .
    environment:
      DB_HOST: localhost
      DB_NAME: pulilan
      DB_USER: root
      DB_PASSWORD: ""
      APP_BASE_PATH: ""
      APP_REQUIRE_RUNTIME_DB: "1"
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./storage/uploads:/var/www/html/storage/uploads
      - mysql_socket:/var/run/mysqld
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: pulilan
    volumes:
      - mysql_data:/var/lib/mysql
      - mysql_socket:/var/run/mysqld
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-pulilan.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -uroot pulilan -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql_data:
  mysql_socket:
